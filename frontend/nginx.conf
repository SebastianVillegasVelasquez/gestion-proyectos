# Para que el proxy soporte WebSockets (notificaciones en tiempo real):
# si el cliente pide upgrade, se propaga; si no, la conexión queda normal.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;

    # Oculta la versión de nginx en headers y páginas de error
    server_tokens off;

    # ── Compresión ────────────────────────────────────────────────────────────
    # El bundle principal pasa de ~405 kB a ~129 kB por cable.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── Headers de seguridad ─────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── SPA ──────────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;

    # Los assets de Vite llevan hash en el nombre: si cambia el contenido,
    # cambia la URL. Cache inmutable de un año sin riesgo de servir versiones
    # viejas.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        # index.html nunca se cachea: es el punto de entrada que apunta a los
        # assets con hash de la última versión desplegada.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # ── API + WebSocket ──────────────────────────────────────────────────────
    location /api/ {
        # Sin esto nginx corta en 1 MB (su valor por defecto) y la subida muere
        # aquí con un 413, antes de llegar al backend: daría igual lo que diga
        # MAX_UPLOAD_MB. Va un poco por encima del tope de la aplicación para
        # que el mensaje de error lo dé ella, que sabe explicarlo.
        client_max_body_size 30m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
