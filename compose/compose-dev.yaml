services:

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: /api/v1
    container_name: frontend-container
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gestion

  backend:
    build: ../backend
    container_name: backend-container
    env_file: ../.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
    networks:
      - gestion

  db:
    image: postgres:17
    container_name: postgres-container
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - gestion

volumes:
  postgres-data:

networks:
  gestion:
    driver: bridge