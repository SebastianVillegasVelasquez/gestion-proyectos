services:
  backend:
    image:
      ghcr.io/SebastianVillegasVelasquez/bitacora-backend:latest
    expose:
      - "8000"
    networks:
      - bitacora-network
    env_file:
      .env.backend
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image:
      ghcr.io/SebastianVillegasVelasquez/bitacora-frontend:latest
    expose:
      - "80"
    networks:
      - bitacora-network

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    env_file:
      .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/


volumes:
  postgres_data:

networks:
  bitacora-network:
    driver: bridge

