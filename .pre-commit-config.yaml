repos:
  # Backend
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: bash -c 'cd backend && poetry run pytest ./tests/unit'
        language: system
        pass_filenames: false
        files: ^backend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^backend/
      - id: end-of-file-fixer
        files: ^backend/
      - id: check-yaml
        files: ^backend/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.2
    hooks:
      - id: ruff
        args: [ --fix ]
        files: ^backend/

      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd backend && poetry run mypy src'
        language: system
        pass_filenames: false
        files: ^backend/


  # Frontend
  - repo: local
    hooks:
      - id: lint-staged-frontend
        name: lint-staged (frontend)
        # Runs eslint --fix + prettier --write on STAGED frontend files only.
        # lint-staged itself reads the staged file list from git, so we don't
        # let pre-commit pass filenames (pass_filenames: false).
        entry: bash -c 'cd frontend && npx lint-staged --relative'
        language: system
        pass_filenames: false
        files: ^frontend/src/.*\.(ts|tsx|js|jsx|json|css|md)$
        stages: [pre-commit]
