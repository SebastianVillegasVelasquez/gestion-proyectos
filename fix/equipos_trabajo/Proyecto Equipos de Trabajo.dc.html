<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:oklch(97.3% 0.004 80);font-family:'Manrope',system-ui,sans-serif;color:oklch(22% 0.01 260);}
  a{color:oklch(50% 0.14 265);text-decoration:none;}
  a:hover{color:oklch(42% 0.15 265);text-decoration:underline;}
  *{box-sizing:border-box;}
</style>
</helmet>

<div style="max-width:1180px;margin:0 auto;padding:32px 32px 60px;display:flex;flex-direction:column;gap:22px;">

  <div style="display:flex;flex-direction:column;gap:14px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <a href="#" style="font-size:13px;color:oklch(52% 0.01 260);font-weight:600;display:flex;align-items:center;gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        Diplomado en Transformación Digital
      </a>
      <button style="width:38px;height:38px;border-radius:10px;border:1px solid oklch(90% 0.005 80);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:oklch(45% 0.01 260);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(50% 0.14 265)" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2.5 20a5.5 5.5 0 0111 0M13 20a5.5 5.5 0 0111 0"/></svg>
      <div>
        <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-0.01em;">Equipos de trabajo</h1>
        <div style="font-size:13.5px;color:oklch(52% 0.01 260);font-weight:500;margin-top:2px;">Agrupaciones de integrantes por frente de trabajo</div>
      </div>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:7px;background:#fff;border:1px solid oklch(90% 0.005 80);border-radius:10px;padding:8px 12px 8px 10px;color:oklch(50% 0.01 260);flex:1;min-width:200px;max-width:280px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span style="font-size:13.5px;font-weight:500;color:oklch(60% 0.008 260);">Buscar equipo…</span>
    </div>
    <span style="flex:1;"></span>
    <button style="display:flex;align-items:center;gap:7px;background:oklch(50% 0.14 265);color:#fff;border:none;border-radius:11px;padding:11px 18px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .15s;" style-hover="background:oklch(43% 0.14 265);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Crear equipo
    </button>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;">

    <div style="background:#fff;border:1px solid oklch(90% 0.005 80);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .15s,border-color .15s;" style-hover="box-shadow:0 6px 18px oklch(20% 0.01 260 / 0.07);border-color:oklch(82% 0.01 260);">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="width:40px;height:40px;border-radius:11px;background:oklch(94% 0.045 265);display:flex;align-items:center;justify-content:center;color:oklch(40% 0.12 265);flex-shrink:0;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2.5 20a5.5 5.5 0 0111 0M13 20a5.5 5.5 0 0111 0"/></svg>
          </div>
          <div>
            <div style="font-size:15.5px;font-weight:700;">Contenidos</div>
            <div style="font-size:12.5px;color:oklch(55% 0.01 260);margin-top:1px;">Módulo 1 · Unidad 1</div>
          </div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(65% 0.008 260)" stroke-width="2"><circle cx="12" cy="6" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="18" r="1.5"/></svg>
      </div>
      <div style="display:flex;align-items:center;gap:0;">
        <span style="width:28px;height:28px;border-radius:50%;background:oklch(50% 0.14 265);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;">SA</span>
        <span style="width:28px;height:28px;border-radius:50%;background:oklch(55% 0.13 155);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;margin-left:-8px;">LC</span>
        <span style="width:28px;height:28px;border-radius:50%;background:oklch(94% 0.004 80);color:oklch(50% 0.01 260);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;margin-left:-8px;">+2</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;padding-top:12px;border-top:1px solid oklch(95% 0.004 80);">
        <div style="display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:oklch(56% 0.008 260);font-weight:700;">
          <span>Progreso</span><span>68%</span>
        </div>
        <div style="height:6px;border-radius:99px;background:oklch(94% 0.004 80);overflow:hidden;">
          <div style="width:68%;height:100%;border-radius:99px;background:oklch(55% 0.14 265);"></div>
        </div>
      </div>
    </div>

    <div style="background:#fff;border:1px solid oklch(90% 0.005 80);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .15s,border-color .15s;" style-hover="box-shadow:0 6px 18px oklch(20% 0.01 260 / 0.07);border-color:oklch(82% 0.01 260);">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="width:40px;height:40px;border-radius:11px;background:oklch(95% 0.02 155);display:flex;align-items:center;justify-content:center;color:oklch(42% 0.06 155);flex-shrink:0;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2.5 20a5.5 5.5 0 0111 0M13 20a5.5 5.5 0 0111 0"/></svg>
          </div>
          <div>
            <div style="font-size:15.5px;font-weight:700;">Diseño instruccional</div>
            <div style="font-size:12.5px;color:oklch(55% 0.01 260);margin-top:1px;">Módulo 1 · Unidad 2</div>
          </div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(65% 0.008 260)" stroke-width="2"><circle cx="12" cy="6" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="18" r="1.5"/></svg>
      </div>
      <div style="display:flex;align-items:center;gap:0;">
        <span style="width:28px;height:28px;border-radius:50%;background:oklch(50% 0.12 30);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;">JD</span>
        <span style="width:28px;height:28px;border-radius:50%;background:oklch(94% 0.004 80);color:oklch(50% 0.01 260);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;margin-left:-8px;">+1</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px;padding-top:12px;border-top:1px solid oklch(95% 0.004 80);">
        <div style="display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:oklch(56% 0.008 260);font-weight:700;">
          <span>Progreso</span><span>24%</span>
        </div>
        <div style="height:6px;border-radius:99px;background:oklch(94% 0.004 80);overflow:hidden;">
          <div style="width:24%;height:100%;border-radius:99px;background:oklch(55% 0.14 265);"></div>
        </div>
      </div>
    </div>

    <div style="background:#fff;border:1.5px dashed oklch(85% 0.006 80);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:oklch(56% 0.008 260);transition:border-color .15s,color .15s;min-height:150px;" style-hover="border-color:oklch(60% 0.01 260);color:oklch(30% 0.01 260);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span style="font-size:13.5px;font-weight:700;">Crear equipo</span>
    </div>

  </div>

</div>

</x-dc>
</body>
</html>
