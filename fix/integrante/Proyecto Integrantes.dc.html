<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:oklch(97.3% 0.004 80);font-family:'Manrope',system-ui,sans-serif;color:oklch(22% 0.01 260);}
  a{color:oklch(50% 0.14 265);text-decoration:none;}
  a:hover{color:oklch(42% 0.15 265);text-decoration:underline;}
  *{box-sizing:border-box;}
</style>
</helmet>

<div style="max-width:1180px;margin:0 auto;padding:32px 32px 60px;display:flex;flex-direction:column;gap:22px;">

  <div style="display:flex;flex-direction:column;gap:14px;">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <a href="#" style="font-size:13px;color:oklch(52% 0.01 260);font-weight:600;display:flex;align-items:center;gap:6px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        Diplomado en Transformación Digital
      </a>
      <button style="width:38px;height:38px;border-radius:10px;border:1px solid oklch(90% 0.005 80);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:oklch(45% 0.01 260);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(50% 0.14 265)" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="7" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0111 0"/><path d="M16.5 4.5a3.2 3.2 0 010 6M21 20a5 5 0 00-5.2-5.4"/></svg>
      <div>
        <h1 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-0.01em;">Integrantes</h1>
        <div style="font-size:13.5px;color:oklch(52% 0.01 260);font-weight:500;margin-top:2px;">Personas con acceso a este proyecto</div>
      </div>
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
    <div style="display:flex;align-items:center;gap:7px;background:#fff;border:1px solid oklch(90% 0.005 80);border-radius:10px;padding:8px 12px 8px 10px;color:oklch(50% 0.01 260);flex:1;min-width:200px;max-width:280px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <span style="font-size:13.5px;font-weight:500;color:oklch(60% 0.008 260);">Buscar integrante…</span>
    </div>
    <button style="display:flex;align-items:center;gap:6px;background:#fff;border:1px solid oklch(90% 0.005 80);border-radius:10px;padding:9px 13px;font-size:13px;font-weight:600;color:oklch(35% 0.01 260);cursor:pointer;font-family:inherit;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      Rol
    </button>
    <span style="flex:1;"></span>
    <button style="display:flex;align-items:center;gap:7px;background:oklch(50% 0.14 265);color:#fff;border:none;border-radius:11px;padding:11px 18px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:background .15s;" style-hover="background:oklch(43% 0.14 265);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Invitar integrante
    </button>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;">

    <div style="background:#fff;border:1px solid oklch(90% 0.005 80);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .15s,border-color .15s;" style-hover="box-shadow:0 6px 18px oklch(20% 0.01 260 / 0.07);border-color:oklch(82% 0.01 260);">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="position:relative;">
            <span style="width:44px;height:44px;border-radius:50%;background:oklch(50% 0.14 265);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;">SA</span>
            <span style="position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:oklch(62% 0.15 145);border:2px solid #fff;"></span>
          </div>
          <div>
            <div style="font-size:14.5px;font-weight:700;">Sofía Aguilar</div>
            <div style="font-size:12.5px;color:oklch(55% 0.01 260);margin-top:1px;">sofia.aguilar@obj.edu</div>
          </div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(65% 0.008 260)" stroke-width="2"><circle cx="12" cy="6" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="18" r="1.5"/></svg>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid oklch(95% 0.004 80);">
        <span style="font-size:11px;font-weight:800;letter-spacing:0.04em;padding:4px 10px;border-radius:6px;background:oklch(94% 0.045 265);color:oklch(40% 0.12 265);">COORDINADORA</span>
        <span style="font-size:12px;color:oklch(56% 0.008 260);font-weight:600;">6 tareas</span>
      </div>
    </div>

    <div style="background:#fff;border:1px solid oklch(90% 0.005 80);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .15s,border-color .15s;" style-hover="box-shadow:0 6px 18px oklch(20% 0.01 260 / 0.07);border-color:oklch(82% 0.01 260);">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="position:relative;">
            <span style="width:44px;height:44px;border-radius:50%;background:oklch(55% 0.13 155);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;">LC</span>
            <span style="position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:oklch(62% 0.15 145);border:2px solid #fff;"></span>
          </div>
          <div>
            <div style="font-size:14.5px;font-weight:700;">Luis Cárdenas</div>
            <div style="font-size:12.5px;color:oklch(55% 0.01 260);margin-top:1px;">luis.cardenas@obj.edu</div>
          </div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(65% 0.008 260)" stroke-width="2"><circle cx="12" cy="6" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="18" r="1.5"/></svg>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid oklch(95% 0.004 80);">
        <span style="font-size:11px;font-weight:800;letter-spacing:0.04em;padding:4px 10px;border-radius:6px;background:oklch(94% 0.06 155);color:oklch(38% 0.1 155);">DOCENTE</span>
        <span style="font-size:12px;color:oklch(56% 0.008 260);font-weight:600;">4 tareas</span>
      </div>
    </div>

    <div style="background:#fff;border:1px solid oklch(90% 0.005 80);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;transition:box-shadow .15s,border-color .15s;" style-hover="box-shadow:0 6px 18px oklch(20% 0.01 260 / 0.07);border-color:oklch(82% 0.01 260);">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="position:relative;">
            <span style="width:44px;height:44px;border-radius:50%;background:oklch(50% 0.12 30);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;">JD</span>
            <span style="position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;background:oklch(75% 0.01 260);border:2px solid #fff;"></span>
          </div>
          <div>
            <div style="font-size:14.5px;font-weight:700;">Julia Duarte</div>
            <div style="font-size:12.5px;color:oklch(55% 0.01 260);margin-top:1px;">julia.duarte@obj.edu</div>
          </div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(65% 0.008 260)" stroke-width="2"><circle cx="12" cy="6" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="18" r="1.5"/></svg>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid oklch(95% 0.004 80);">
        <span style="font-size:11px;font-weight:800;letter-spacing:0.04em;padding:4px 10px;border-radius:6px;background:oklch(95% 0.03 240);color:oklch(45% 0.1 240);">DISEÑO</span>
        <span style="font-size:12px;color:oklch(56% 0.008 260);font-weight:600;">2 tareas</span>
      </div>
    </div>

    <div style="background:#fff;border:1.5px dashed oklch(85% 0.006 80);border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;color:oklch(56% 0.008 260);transition:border-color .15s,color .15s;min-height:126px;" style-hover="border-color:oklch(60% 0.01 260);color:oklch(30% 0.01 260);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span style="font-size:13.5px;font-weight:700;">Invitar integrante</span>
    </div>

  </div>

</div>

</x-dc>
</body>
</html>
