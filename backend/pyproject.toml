[tool.poetry]
name = "backend"
version = "0.1.0"
description = ""
authors = ["SebastianVillegasVelasquez <villegasvelasquezs@gmail.com>"]
packages = [{ include = "app", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.136.1"
uvicorn = "^0.47.0"
sqlalchemy = "^2.0.49"
alembic = "^1.18.4"
pydantic = {extras = ["email", "settings"], version = "^2.13.4"}
asyncpg = "^0.31.0"
httpx = "^0.28.1"
pydantic-settings = "^2.14.1"
pwdlib = {extras = ["argon2"], version = "^0.3.0"}
python-jose = {extras = ["cryptography"], version = "^3.5.0"}
python-multipart = "^0.0.29"
types-python-jose = "^3.5.0.20260408"
redis = ">=5"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
ruff = "^0.15.13"
mypy = "^2.1.0"
pre-commit = "^4.6.0"
selenium = "^4.44.0"
pytest-asyncio = "^1.3.0"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "integration",
]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.mypy]
# Configuración deliberadamente poco estricta: detecta errores reales (tipos
# incompatibles, None no manejado) sin exigir anotar todo el código heredado.
python_version = "3.13"
ignore_missing_imports = true       # no exige stubs de libs de terceros
check_untyped_defs = true           # revisa el cuerpo de funciones sin anotar
# NO activamos disallow_untyped_defs / strict / warn_unused_ignores: demasiado
# ruidoso para este código (p. ej. ignores defensivos de pydantic-settings).
exclude = '(^|/)(alembic|tests)/'

[tool.ruff.lint.per-file-ignores]
# pytest re-exports fixtures via import; test method parameters shadow them (expected)
"tests/integration/teams/test_workspace_task_link.py" = ["F811"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
